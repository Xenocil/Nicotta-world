 const noise=(duration,frequency,level,band='lowpass')=>{const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=noiseBuffer;src.playbackRate.value=.8+Math.random()*.3;filter.type=band;filter.frequency.value=frequency;filter.Q.value=1.1;gain.gain.setValueAtTime(level,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);src.connect(filter);filter.connect(gain);gain.connect(master);src.start(now,Math.random()*.4);src.stop(now+duration);src.onended=()=>{src.disconnect();filter.disconnect();gain.disconnect()}};

function passable(x,y){return x>=0&&y>=0&&x<W&&y<H&&ground[idx(x,y)]!==7&&build[idx(x,y)]!==2&&build[idx(x,y)]!==5&&!resourceAt(x,y)&&allowed(x,y)}
function pathfind(sx,sy,tx,ty){if(!passable(tx,ty))return[];const q=[[sx,sy]],prev=new Int32Array(W*H);prev.fill(-2);prev[idx(sx,sy)]=-1;let qi=0;while(qi<q.length){const[x,y]=q[qi++];if(x===tx&&y===ty)break;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!passable(nx,ny))continue;const ni=idx(nx,ny);if(prev[ni]!==-2)continue;prev[ni]=idx(x,y);q.push([nx,ny])}}if(prev[idx(tx,ty)]===-2)return[];let out=[],cur=idx(tx,ty);while(cur!==idx(sx,sy)){out.push([cur%W,(cur/W)|0]);cur=prev[cur]}return out.reverse()}

function routeMap(){const prev=new Int32Array(W*H),dist=new Int32Array(W*H),queue=new Int32Array(W*H);prev.fill(-2);dist.fill(-1);let head=0,tail=1;const start=idx(nico.x,nico.y);queue[0]=start;prev[start]=-1;dist[start]=0;while(head<tail){const k=queue[head++],x=k%W,y=(k/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!passable(nx,ny))continue;const ni=idx(nx,ny);if(prev[ni]!==-2)continue;prev[ni]=k;dist[ni]=dist[k]+1;queue[tail++]=ni}}return {dist,path(k){let path=[];while(k!==start){path.push([k%W,(k/W)|0]);k=prev[k]}return path.reverse()}}}

function drawZones(){if(menu!=='zones'&&!zoneEditor&&!nico.selected)return;const viewW=innerWidth/cam.zoom,viewH=innerHeight/cam.zoom;ctx.save();for(const z of zones){if(z.x1*TILE<cam.x-viewW/2||z.x0*TILE>cam.x+viewW/2||z.y1*TILE<cam.y-viewH/2||z.y0*TILE>cam.y+viewH/2)continue;ctx.fillStyle=z.kind==='stock'?'#78bca719':z.kind==='area'?'#78a9ef16':'#debf8810';ctx.strokeStyle=z.kind==='stock'?'#83d6bbaa':z.kind==='area'?'#8dbbff99':'#debf8866';ctx.lineWidth=1/cam.zoom;ctx.setLineDash([4/cam.zoom,4/cam.zoom]);ctx.fillRect(z.x0*TILE,z.y0*TILE,(z.x1-z.x0+1)*TILE,(z.y1-z.y0+1)*TILE);ctx.strokeRect(z.x0*TILE,z.y0*TILE,(z.x1-z.x0+1)*TILE,(z.y1-z.y0+1)*TILE)}if(zoneDrag){const z=zoneDrag;ctx.setLineDash([]);ctx.strokeStyle='#9fe7ff';ctx.strokeRect(Math.min(z.x,z.ex)*TILE,Math.min(z.y,z.ey)*TILE,(Math.abs(z.x-z.ex)+1)*TILE,(Math.abs(z.y-z.ey)+1)*TILE)}ctx.restore()}
function frame(t){const dt=Math.min(.04,(t-(frame.last||t))/1000);frame.last=t;const pan=520*dt/cam.zoom;if(keys.has('w')||keys.has('arrowup'))cam.y-=pan;if(keys.has('s')||keys.has('arrowdown'))cam.y+=pan;if(keys.has('a')||keys.has('arrowleft'))cam.x-=pan;if(keys.has('d')||keys.has('arrowright'))cam.x+=pan;if(!paused){simTime+=dt*speed;stepNico(dt*speed)}ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#170f13';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.translate(innerWidth/2,innerHeight/2);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.x,-cam.y);drawWorld();drawWaterFx(t);drawContactShadows();drawZones();drawDepthSorted(t);ctx.setTransform(DPR,0,0,DPR,0,0);if(!frame.uiAt||t-frame.uiAt>150){frame.uiAt=t;document.getElementById('status').textContent=`${paused?'⏸ 一時停止':'▶ '+speed+'x'} / map ${W}×${H} / zoom ${cam.zoom.toFixed(2)}x / jobs ${jobs.length}`;document.getElementById('panel').classList.toggle('show',nico.selected||!!nico.job);document.getElementById('nicoState').textContent=nico.state;const c=inventoryCounts();for(let i=0;i<2;i++)document.getElementById('stock'+i).textContent=c[i]}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
